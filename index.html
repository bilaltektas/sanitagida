<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Dashboard PRO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

html,body{
  width:100%;
  height:100%;
}

body{
  background:#020817;
  color:#fff;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#particles{
  position:fixed;
  inset:0;
  z-index:0;
}

.topbar{
  display:flex;
  justify-content:center;
  padding:12px;
  z-index:2;
  flex-shrink:0;
}

.nav-center{
  padding:12px 30px;
  border-radius:16px;
  border:1px solid #00eaff;
  box-shadow:0 0 25px #00eaff;
  font-weight:800;
  cursor:pointer;
}

.menu{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  padding:12px;
  z-index:2;
  overflow-y:auto;
}

.card{
  width:100%;
  height:110px;
  border-radius:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
}

.left{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.title{
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.desc{
  font-size:11px;
  opacity:0.7;
  margin-top:4px;
}

.open{
  margin-top:6px;
  font-size:11px;
  padding:5px 10px;
  border-radius:12px;
  border:1px solid currentColor;
  width:max-content;
}

.visual{
  width:70px;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.visual svg{
  width:62px;
  height:62px;
  fill:currentColor;
  filter:drop-shadow(0 0 18px currentColor);
}

/* COLORS */
.c1{background:linear-gradient(135deg,#021b2f,#003b5c);color:#00eaff}
.c2{background:linear-gradient(135deg,#1a0033,#3a0066);color:#ff5cff}
.c3{background:linear-gradient(135deg,#002b1c,#004d2e);color:#00ff99}
.c4{background:linear-gradient(135deg,#2b1400,#663300);color:#ff9900}
.c5{background:linear-gradient(135deg,#001a33,#003366);color:#00ccff}

iframe{
  width:100%;
  height:100%;
  flex:1;
  border:none;
  display:none;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="topbar">
  <div class="nav-center" onclick="goHome()">🏠 ANASAYFA</div>
</div>

<div class="menu" id="menu">

<!-- STOK -->
<div class="card c1" onclick="openSite('https://bilaltektas.github.io/stok-miktarlari/')">
  <div class="left">
    <div class="title">Stok Miktarları ve MAL KABUL</div>
    <div class="desc">Depo stok durumu ve Mal Kabul Girdi/Çıktı Takibi</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/679/679720.png" width="60">
  </div>
</div>

<!-- REÇETE -->
<div class="card c2" onclick="openSite('https://bilaltektas.github.io/recete_robotu/')">
  <div class="left">
    <div class="title">REÇETE SORGULAMA</div>
    <div class="desc">Formül ve üretim analizleri</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/2784/2784445.png" width="60">
  </div>
</div>

<!-- 🔥 STOK KODU ASİSTANI (QR SCAN ICON) -->
<div class="card c3" onclick="openSite('https://bilaltektas.github.io/stok-kodu-asistan-/')">
  <div class="left">
    <div class="title">STOK KODU ASİSTANI</div>
    <div class="desc">Barcode & QR Scan</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <svg viewBox="0 0 24 24">
      <path d="M3 3h7v7H3V3zm2 2v3h3V5H5zm9-2h7v7h-7V3zm2 2v3h3V5h-3zM3 14h7v7H3v-7zm2 2v3h3v-3H5zm10-2h2v2h-2v-2zm4 0h2v2h-2v-2zm-4 4h2v2h-2v-2zm4 0h2v2h-2v-2z"/>
    </svg>
  </div>
</div>

<!-- ZAMAN -->
<div class="card c4" onclick="openSite('https://bilaltektas.github.io/zaman-hesaplama/')">
  <div class="left">
    <div class="title">ÇALIŞMA SÜRESİ</div>
    <div class="desc">Zaman ve vardiya hesaplama</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/992/992700.png" width="60">
  </div>
</div>

<!-- 🔥 LOT TAKİP (NUMBER TAG ICON) -->
<div class="card c5" onclick="openSite('https://bilaltektas.github.io/lot-no-asistan/')">
  <div class="left">
    <div class="title">LOT TAKİP</div>
    <div class="desc">Batch & Numara Takibi</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <svg viewBox="0 0 24 24">
      <path d="M20 10V4h-6l-2 2H4v14h16V10zm-9 7H6v-2h5v2zm0-4H6v-2h5v2zm7 4h-5v-2h5v2zm0-4h-5v-2h5v2z"/>
    </svg>
  </div>
</div>

</div>

<iframe id="frame"></iframe>

<script>
const menu=document.getElementById('menu');
const frame=document.getElementById('frame');

function openSite(url){
  menu.style.display='none';
  frame.style.display='block';
  frame.src=url;
}

function goHome(){
  frame.style.display='none';
  frame.src='';
  menu.style.display='grid';
}
</script>

</body>
</html>

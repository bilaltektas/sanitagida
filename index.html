<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Dashboard PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}

body{
  background:#020817;
  color:#fff;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* PARTICLES */
#particles{
  position:fixed;
  inset:0;
  z-index:0;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:center;
  padding:15px;
  z-index:2;
}

.nav-center{
  padding:14px 40px;
  border-radius:18px;
  border:1px solid #00eaff;
  box-shadow:0 0 25px #00eaff;
  font-weight:800;
  cursor:pointer;
}

/* GRID */
.menu{
  flex:1;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
  padding:20px;
  z-index:2;
  overflow:auto;
}

/* CARD */
.card{
  height:200px;
  border-radius:22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:0.2s;
  transform-style:preserve-3d;
}

.card:hover{
  box-shadow:0 0 60px currentColor;
}

/* CONTENT */
.left{
  max-width:60%;
}

.title{
  font-size:20px;
  font-weight:900;
}

.desc{
  font-size:13px;
  opacity:0.7;
  margin-top:6px;
}

.open{
  margin-top:12px;
  padding:8px 18px;
  border-radius:20px;
  border:1px solid currentColor;
}

/* ICON (ULTRA) */
.visual{
  width:120px;
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.visual img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:
    drop-shadow(0 0 20px currentColor)
    drop-shadow(0 0 50px currentColor)
    drop-shadow(0 0 80px currentColor)
    brightness(1.3) contrast(1.2);
  transition:0.3s;
}

.card:hover .visual img{
  transform:scale(1.15) rotate(2deg);
}

/* COLORS */
.c1{background:linear-gradient(135deg,#021b2f,#003b5c);color:#00eaff}
.c2{background:linear-gradient(135deg,#1a0033,#3a0066);color:#ff5cff}
.c3{background:linear-gradient(135deg,#002b1c,#004d2e);color:#00ff99}
.c4{background:linear-gradient(135deg,#2b1400,#663300);color:#ff9900}
.c5{background:linear-gradient(135deg,#001a33,#003366);color:#00ccff}

/* IFRAME */
iframe{
  width:100%;
  height:100%;
  border:none;
  display:none;
  flex:1;
  z-index:2;
}

/* MOBILE */
@media(max-width:600px){
  .card{height:auto;flex-direction:column;align-items:flex-start}
  .visual{margin-top:10px}
  .left{max-width:100%}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="topbar">
  <div class="nav-center" onclick="goHome()">🏠 ANASAYFA</div>
</div>

<div class="menu" id="menu">

<!-- STOK -->
<div class="card c1" onclick="openSite('https://bilaltektas.github.io/stok-miktarlari/')">
  <div class="left">
    <div class="title">STOK MİKTARLARI VE MAL KABUL</div>
    <div class="desc">Depo, giriş ve stok yönetimi</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/679/679720.png">
  </div>
</div>

<!-- REÇETE -->
<div class="card c2" onclick="openSite('https://bilaltektas.github.io/recete_robotu/')">
  <div class="left">
    <div class="title">REÇETE SORGULAMA</div>
    <div class="desc">Formül ve üretim analizleri</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/2784/2784445.png">
  </div>
</div>

<!-- STOK KODU -->
<div class="card c3" onclick="openSite('https://bilaltektas.github.io/stok-kodu-asistan-/')">
  <div class="left">
    <div class="title">STOK KODU ASİSTANI</div>
    <div class="desc">Barcode ve ürün analizi</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/483/483947.png">
  </div>
</div>

<!-- SÜRE -->
<div class="card c4" onclick="openSite('https://bilaltektas.github.io/zaman-hesaplama/')">
  <div class="left">
    <div class="title">ÇALIŞMA SÜRESİ</div>
    <div class="desc">Zaman ve vardiya hesaplama</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/992/992700.png">
  </div>
</div>

<!-- LOT -->
<div class="card c5" onclick="openSite('https://bilaltektas.github.io/lot-no-asistan/')">
  <div class="left">
    <div class="title">LOT TAKİP</div>
    <div class="desc">Ürün ve parti izleme sistemi</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/1048/1048946.png">
  </div>
</div>

</div>

<iframe id="frame"></iframe>

<script>
const menu=document.getElementById('menu');
const frame=document.getElementById('frame');

function openSite(url){
  menu.style.display='none';
  frame.style.display='block';
  frame.src=url;
}

function goHome(){
  frame.style.display='none';
  frame.src='';
  menu.style.display='grid';
}

/* TILT */
document.querySelectorAll('.card').forEach(card=>{
  card.addEventListener('mousemove',e=>{
    const r=card.getBoundingClientRect();
    const x=e.clientX-r.left;
    const y=e.clientY-r.top;
    card.style.transform=`rotateX(${-(y-r.height/2)/25}deg) rotateY(${(x-r.width/2)/25}deg)`;
  });
  card.addEventListener('mouseleave',()=>card.style.transform='rotateX(0) rotateY(0)');
});

/* PARTICLES */
const c=document.getElementById('particles');
const ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();

let p=[...Array(60)].map(()=>({
x:Math.random()*c.width,
y:Math.random()*c.height,
vx:(Math.random()-0.5)*0.5,
vy:(Math.random()-0.5)*0.5
}));

function anim(){
ctx.clearRect(0,0,c.width,c.height);
ctx.fillStyle="#00eaff";
p.forEach(o=>{
o.x+=o.vx;o.y+=o.vy;
if(o.x<0||o.x>c.width)o.vx*=-1;
if(o.y<0||o.y>c.height)o.vy*=-1;
ctx.fillRect(o.x,o.y,2,2);
});
requestAnimationFrame(anim);
}
anim();
onresize=resize;
</script>

</body>
</html>

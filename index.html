<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Dashboard PRO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

html,body{
  width:100%;
  height:100%;
}

/* ROOT */
body{
  background:#020817;
  color:#fff;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* PARTICLES */
#particles{
  position:fixed;
  inset:0;
  z-index:0;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:center;
  padding:12px;
  z-index:2;
  flex-shrink:0;
}

.nav-center{
  padding:12px 30px;
  border-radius:16px;
  border:1px solid #00eaff;
  box-shadow:0 0 25px #00eaff;
  font-weight:800;
  cursor:pointer;
}

/* MENU */
.menu{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  padding:12px;
  z-index:2;
  overflow-y:auto;
}

/* CARD */
.card{
  width:100%;
  height:110px;
  border-radius:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:0.2s;
}

/* TEXT */
.left{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.title{
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.desc{
  font-size:11px;
  opacity:0.7;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.open{
  margin-top:6px;
  font-size:11px;
  padding:5px 10px;
  border-radius:12px;
  border:1px solid currentColor;
  width:max-content;
}

/* ICON */
.visual{
  width:70px;
  height:70px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.visual img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:
    drop-shadow(0 0 20px currentColor)
    drop-shadow(0 0 50px currentColor)
    brightness(1.2);
}

/* COLORS */
.c1{background:linear-gradient(135deg,#021b2f,#003b5c);color:#00eaff}
.c2{background:linear-gradient(135deg,#1a0033,#3a0066);color:#ff5cff}
.c3{background:linear-gradient(135deg,#002b1c,#004d2e);color:#00ff99}
.c4{background:linear-gradient(135deg,#2b1400,#663300);color:#ff9900}
.c5{background:linear-gradient(135deg,#001a33,#003366);color:#00ccff}

/* FRAME */
iframe{
  width:100%;
  height:100%;
  flex:1;
  border:none;
  display:none;
  z-index:2;
}

/* TABLET */
@media(min-width:600px){
  .menu{
    grid-template-columns:repeat(2,1fr);
  }

  .card{
    height:140px;
  }

  .title{
    font-size:16px;
  }

  .visual{
    width:90px;
    height:90px;
  }
}

/* DESKTOP */
@media(min-width:1024px){
  .menu{
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  }

  .card{
    height:180px;
  }

  .title{
    font-size:18px;
  }

  .visual{
    width:120px;
    height:120px;
  }
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="topbar">
  <div class="nav-center" onclick="goHome()">🏠 ANASAYFA</div>
</div>

<div class="menu" id="menu">

<div class="card c1" onclick="openSite('https://bilaltektas.github.io/stok-miktarlari/')">
  <div class="left">
    <div class="title">STOK & MAL KABUL</div>
    <div class="desc">Depo, giriş ve stok yönetimi</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/679/679720.png">
  </div>
</div>

<div class="card c2" onclick="openSite('https://bilaltektas.github.io/recete_robotu/')">
  <div class="left">
    <div class="title">REÇETE SORGULAMA</div>
    <div class="desc">Formül ve üretim analizleri</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/2784/2784445.png">
  </div>
</div>

<div class="card c3" onclick="openSite('https://bilaltektas.github.io/stok-kodu-asistan-/')">
  <div class="left">
    <div class="title">STOK KODU ASİSTANI</div>
    <div class="desc">Barcode ve ürün analizi</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/483/483947.png">
  </div>
</div>

<div class="card c4" onclick="openSite('https://bilaltektas.github.io/zaman-hesaplama/')">
  <div class="left">
    <div class="title">ÇALIŞMA SÜRESİ</div>
    <div class="desc">Zaman ve vardiya hesaplama</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/992/992700.png">
  </div>
</div>

<div class="card c5" onclick="openSite('https://bilaltektas.github.io/lot-no-asistan/')">
  <div class="left">
    <div class="title">LOT TAKİP</div>
    <div class="desc">Ürün ve parti izleme sistemi</div>
    <div class="open">AÇ</div>
  </div>
  <div class="visual">
    <img src="https://cdn-icons-png.flaticon.com/512/1048/1048946.png">
  </div>
</div>

</div>

<iframe id="frame"></iframe>

<script>
const menu=document.getElementById('menu');
const frame=document.getElementById('frame');

function openSite(url){
  menu.style.display='none';
  frame.style.display='block';
  frame.src=url;
}

function goHome(){
  frame.style.display='none';
  frame.src='';
  menu.style.display='grid';
}

/* PARTICLES */
const c=document.getElementById('particles');
const ctx=c.getContext('2d');

function resize(){
  c.width=innerWidth;
  c.height=innerHeight;
}
resize();

let p=[...Array(50)].map(()=>({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  vx:(Math.random()-0.5)*0.5,
  vy:(Math.random()-0.5)*0.5
}));

function anim(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle="#00eaff";

  p.forEach(o=>{
    o.x+=o.vx;
    o.y+=o.vy;

    if(o.x<0||o.x>c.width)o.vx*=-1;
    if(o.y<0||o.y>c.height)o.vy*=-1;

    ctx.fillRect(o.x,o.y,2,2);
  });

  requestAnimationFrame(anim);
}
anim();

onresize=resize;
</script>

</body>
</html>
